---
name: Vendor Dependencies Check
on:
  pull_request:
    types: ['opened', 'synchronize']
    paths:
      - '**.go'
      - 'vendor/**'
      - '.github/workflows/**'

jobs:
  depscheck:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
         go-version: '1.26.5'
      - run: chmod -R +x ./scripts
      - run: bash scripts/gogetcookie.sh
      - run: make depscheck
